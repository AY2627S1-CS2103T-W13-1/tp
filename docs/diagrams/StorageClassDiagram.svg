<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storage-class-diagram-title storage-class-diagram-desc" id="storage-class-diagram-root">
      <title id="storage-class-diagram-title">CouchCoach Storage component · UML class diagram</title>
      <desc id="storage-class-diagram-desc">Class diagram showing StorageManager realizing the Storage interface and owning one JsonUserPrefsStorage and one JsonAddressBookStorage, which uses a JsonSerializableAddressBook holding any number of JsonAdaptedPerson objects, each saving a name, a phone and an optional jersey number.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #storage-class-diagram-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #storage-class-diagram-root { font-family: var(--font-sans); color: var(--color-ink); }
      #storage-class-diagram-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#storage-class-diagram-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="storage-class-diagram-uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="storage-class-diagram-uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142"/>
        </marker>
        <marker id="storage-class-diagram-uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="storage-class-diagram-uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Relationships (drawn before boxes) -->
      <!-- StorageManager realizes Storage -->
      <line x1="480" y1="224" x2="480" y2="176" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#storage-class-diagram-uml-triangle)"/>
      <!-- StorageManager associates one JsonAddressBookStorage -->
      <line x1="480" y1="272" x2="480" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#storage-class-diagram-uml-open)"/>
      <!-- StorageManager associates one JsonUserPrefsStorage (elbow) -->
      <path d="M 380,248 H 158 Q 150,248 150,256 V 360" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#storage-class-diagram-uml-open)"/>
      <!-- JsonAddressBookStorage uses JsonSerializableAddressBook -->
      <line x1="580" y1="400" x2="696" y2="400" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#storage-class-diagram-uml-open)"/>
      <!-- JsonSerializableAddressBook associates any number of JsonAdaptedPerson -->
      <line x1="808" y1="360" x2="808" y2="308" stroke="#4f5d75" stroke-width="1" marker-end="url(#storage-class-diagram-uml-open)"/>

      <!-- Dependency label -->
      <rect x="622" y="380" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="638" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USES</text>

      <!-- Multiplicities: StorageManager to JsonAddressBookStorage -->
      <rect x="488" y="280" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="494" y="289" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
      <rect x="488" y="336" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="494" y="345" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <!-- Multiplicities: StorageManager to JsonUserPrefsStorage -->
      <rect x="356" y="228" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="362" y="237" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
      <rect x="158" y="336" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="164" y="345" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <!-- Multiplicities: JsonSerializableAddressBook to JsonAdaptedPerson -->
      <rect x="816" y="316" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="830" y="325" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">0..*</text>
      <rect x="816" y="340" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="822" y="349" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <!-- Class: Storage (interface) -->
      <rect x="300" y="40" width="360" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="300" y1="80" x2="660" y2="80" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
      <text x="480" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«interface»</text>
      <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storage</text>
      <text x="316" y="100" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ readAddressBook(): Optional&lt;ReadOnlyAddressBook&gt;</text>
      <text x="316" y="120" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ saveAddressBook(ReadOnlyAddressBook): void</text>
      <text x="316" y="140" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ readUserPrefs(): Optional&lt;UserPrefs&gt;</text>
      <text x="316" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ saveUserPrefs(ReadOnlyUserPrefs): void</text>

      <!-- Class: StorageManager -->
      <rect x="380" y="224" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StorageManager</text>

      <!-- Class: JsonAdaptedPerson (focal) -->
      <rect x="696" y="160" width="224" height="148" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.04"/>
      <rect x="696" y="160" width="224" height="40" rx="6" fill="#bf4520" fill-opacity="0.10"/>
      <rect x="696" y="192" width="224" height="8" fill="#bf4520" fill-opacity="0.10"/>
      <line x1="696" y1="200" x2="920" y2="200" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
      <text x="808" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JsonAdaptedPerson</text>
      <text x="712" y="220" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- name: String</text>
      <text x="712" y="240" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- phone: String</text>
      <text x="712" y="260" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">- jerseyNumber: String [0..1]</text>
      <line x1="696" y1="272" x2="920" y2="272" stroke="#bf4520" stroke-width="1" stroke-opacity="0.40"/>
      <text x="712" y="292" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ toModelType(): Person</text>

      <!-- Class: JsonUserPrefsStorage -->
      <rect x="40" y="360" width="220" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="40" y1="400" x2="260" y2="400" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
      <text x="150" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JsonUserPrefsStorage</text>
      <text x="56" y="420" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- filePath: Path</text>

      <!-- Class: JsonAddressBookStorage -->
      <rect x="380" y="360" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="380" y1="400" x2="580" y2="400" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
      <text x="480" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JsonAddressBookStorage</text>
      <text x="396" y="420" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- filePath: Path</text>

      <!-- Class: JsonSerializableAddressBook -->
      <rect x="696" y="360" width="224" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="696" y1="400" x2="920" y2="400" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
      <text x="808" y="384" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JsonSerializableAddressBook</text>
      <text x="712" y="420" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ toModelType(): AddressBook</text>

      <!-- Annotation callout: why the jersey number is optional in the file -->
      <text x="920" y="84" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">left out of the file when a player</text>
      <text x="920" y="104" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">has no jersey number</text>
      <path d="M 928,108 Q 944,184 920,256" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
      <circle cx="920" cy="256" r="2" fill="#2d3142"/>

      <!-- Legend: relationship vocabulary -->
      <line x1="40" y1="532" x2="920" y2="532" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
      <text x="40" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

      <line x1="40" y1="568" x2="68" y2="568" stroke="#2d3142" stroke-width="1" marker-end="url(#storage-class-diagram-uml-triangle)"/>
      <text x="76" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Inheritance</text>

      <line x1="188" y1="568" x2="216" y2="568" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#storage-class-diagram-uml-triangle)"/>
      <text x="224" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Realization</text>

      <line x1="336" y1="568" x2="364" y2="568" stroke="#2d3142" stroke-width="1" marker-start="url(#storage-class-diagram-uml-diamond-filled)"/>
      <text x="372" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

      <line x1="484" y1="568" x2="512" y2="568" stroke="#2d3142" stroke-width="1" marker-start="url(#storage-class-diagram-uml-diamond-hollow)"/>
      <text x="520" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Aggregation · has</text>

      <line x1="632" y1="568" x2="660" y2="568" stroke="#4f5d75" stroke-width="1" marker-end="url(#storage-class-diagram-uml-open)"/>
      <text x="668" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Association</text>

      <line x1="780" y1="568" x2="808" y2="568" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#storage-class-diagram-uml-open)"/>
      <text x="816" y="572" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dependency · uses</text>
    </svg>
